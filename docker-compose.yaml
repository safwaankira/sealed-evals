services:
  shade-agent-app:
    environment:
      AGENT_CONTRACT_ID: ${AGENT_CONTRACT_ID}
      SPONSOR_ACCOUNT_ID: ${SPONSOR_ACCOUNT_ID}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY}
      NEARAI_CLOUD_API_KEY: ${NEARAI_CLOUD_API_KEY}
    platform: linux/amd64
    image: predaconus/sealed-evals@sha256:10e41c045286aa71653e13c236552b33e3d43e7dc8dc54e168710d97d5b75290
    container_name: sealed-evals
    ports:
      - 3000:3000
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - sealed-data:/data
    restart: always
volumes:
  sealed-data: null
